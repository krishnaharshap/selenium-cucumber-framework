name: Publish Allure Report → GitHub Pages

# Triggered after the main CI smoke tests complete, or manually.
# Free GitHub Pages hosting — report URL: https://krishnaharshap.github.io/selenium-cucumber-framework/
on:
  workflow_run:
    workflows: ["CI - Maven Smoke Tests"]
    branches: [main, develop]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write    # needed to push to gh-pages branch

jobs:
  allure-report:
    name: Generate & Deploy Allure Report
    runs-on: ubuntu-latest
    # Run even when CI failed so we can see failure details in the report
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Run smoke tests (results only)
        run: >
          mvn -B -ntp test
          -Dbrowser=chrome
          -Dheadless=true
          "-Dcucumber.filter.tags=@Smoke"
        continue-on-error: true

      - name: Publish Allure Report
        uses: ./.github/actions/publish-allure-report
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update Allure report from CI smoke run [skip ci]"
